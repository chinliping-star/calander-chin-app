<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="image" href="/logo.png" fetchpriority="high" />
    <!-- Font never blocks first paint: loads as "print" then switches to all; text shows in the fallback font meanwhile -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" /></noscript>
    <meta name="theme-color" content="#FF7FB1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Friendiary" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friendiary – Plan meetups with friends, the cute way</title>
    <!-- Tells Google the site name, logo and what it is (brand result + logo in search) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Friendiary",
            "url": "https://www.friendiary.com/",
            "description": "Your cute personal social calendar: plan meetups, share your calendar, make memories with friends."
          },
          {
            "@type": "Organization",
            "name": "Friendiary",
            "url": "https://www.friendiary.com/",
            "logo": "https://www.friendiary.com/logo.png"
          }
        ]
      }
    </script>
    <meta name="description" content="Your cute personal social calendar — plan meetups, share your calendar, make memories with friends." />
    <meta property="og:title" content="Friendiary" />
    <meta property="og:description" content="Your cute personal social calendar — plan meetups, share your calendar, make memories with friends." />
    <meta property="og:image" content="https://www.friendiary.com/logo.png" />
    <meta property="og:url" content="https://www.friendiary.com/" />
    <meta property="og:site_name" content="Friendiary" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/logo.png" />
  </head>
  <body>
    <!-- App shell: paints the logo before the JS bundle runs; React replaces it on first render -->
    <div id="app-shell" style="position:fixed;inset:0;z-index:0"><div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(135deg,#fff8fb 0%,#fdf4ff 50%,#f8f0ff 100%);font-family:system-ui,sans-serif"><img src="/logo.png" alt="Friendiary" width="140" height="140" fetchpriority="high" /><p style="margin:0;color:#4A3E4E;font-size:36px;font-weight:800;letter-spacing:-0.5px">Friendiary</p><p style="margin:0;color:#6b6375;font-size:14px;font-weight:600">Loading your calendar…</p></div></div>
    <script>
      // Landing page: paint the real hero heading before the app bundle loads. It is the page's
      // largest text (LCP), so this keeps mobile LCP at first paint instead of after the JS.
      if (location.pathname === '/') document.getElementById('app-shell').innerHTML =
        '<div style="min-height:100vh;background:linear-gradient(180deg,#fff8fb 0%,#fdf4ff 45%,#fff 100%);font-family:Manrope,system-ui,sans-serif">' +
        '<div style="max-width:72rem;margin:0 auto;padding:120px 16px 0">' +
        '<p style="margin:0 0 20px;display:inline-block;border-radius:999px;padding:4px 12px;background:#FFF0F6;color:#B83D72;font-size:12px;font-weight:600">🌸 Your cute social calendar</p>' +
        '<p style="margin:0;max-width:34rem;font-size:clamp(40px,4.2vw,52px);line-height:1.25;font-weight:800;color:#4A3E4E">Plan meetups with friends, the cute way.</p>' +
        '</div></div>';
    </script>
    <div id="root" style="position:relative;z-index:1"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
