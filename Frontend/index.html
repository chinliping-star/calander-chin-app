<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="image" href="/logo.png" fetchpriority="high" />
    <!-- Font never blocks first paint: loads as "print" then switches to all; text shows in the fallback font meanwhile -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" /></noscript>
    <meta name="theme-color" content="#FF7FB1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Friendiary" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friendiary</title>
    <meta name="description" content="Your cute personal social calendar — plan meetups, share your calendar, make memories with friends." />
    <meta property="og:title" content="Friendiary" />
    <meta property="og:description" content="Your cute personal social calendar — plan meetups, share your calendar, make memories with friends." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/logo.png" />
  </head>
  <body>
    <!-- App shell: paints the logo before the JS bundle runs; React replaces it on first render -->
    <div id="root"><div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(135deg,#fff8fb 0%,#fdf4ff 50%,#f8f0ff 100%);font-family:system-ui,sans-serif"><img src="/logo.png" alt="Friendiary" width="140" height="140" fetchpriority="high" /><p style="margin:0;color:#4A3E4E;font-size:36px;font-weight:800;letter-spacing:-0.5px">Friendiary</p><p style="margin:0;color:#6b6375;font-size:14px;font-weight:600">Loading your calendar…</p></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
